/* Phone layout. A table's name column used to be squeezed to two letters per line by the state column and its
   buttons (overflow-wrap:anywhere lets the column shrink to nothing), and a wide table pushed the page sideways. */
@media (max-width: 700px) {
  .content { padding: 14px 12px 50px; }
  section, .card { padding: 14px 14px; }
  h1 { font-size: 22px; }
  /* Wide tables scroll sideways inside their card instead of widening the whole page. */
  .content table { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .content th, .content td { padding-right: 12px; }
  /* Lists of files: the name keeps the whole line; the state and the buttons wrap beneath it. */
  .content table.stack { overflow-x: visible; }
  table.stack thead, table.stack tbody { display: block; }

  table.stack td, table.stack th { display: block; border: 0; padding: 0; width: auto; }

// again and again (seen once: about every 3.7 s for 80 s after a scan) pauses its own reloading instead. Six reloads
// within 25 s is the limit (the per-kind minimum gaps below keep a running job far under it: the job list reloads at
// most every 15 s). After that the tab stays calm for 5 minutes and says why.
const reloadLogKey='subsynq-reload-log',reloadPauseKey='subsynq-reload-pause';
const reloadWindowMs=25000,reloadLimit=6,reloadPauseMs=300000;
// A reload of the same kind waits at least this long after the last one, so a running job (its progress changes the
// list every second or two) cannot make the page blink and fetch itself again every few seconds.
const reloadMinGapMs={queue:15000,status:15000,hardware:15000,models:5000,scan:3000,cleanup:5000};
// Real log, dev 2026-10-14: the user tapped "Kö" while a job ran; the page's own reload was issued before the new page
// had arrived and replaced the tap, so the queue page could not be opened at all. A tap on a link or a form submit
// therefore blocks every automatic reload for 15 s (3 s for a finger that only touched a link).
let navigationUntil=0;
function noteNavigation(ms){navigationUntil=Math.max(navigationUntil,Date.now()+ms)}

}

function reloadState(){
  let log=[],until=0;
  try{
    log=JSON.parse(sessionStorage.getItem(reloadLogKey)||'[]');
    until=Number(sessionStorage.getItem(reloadPauseKey)||0);
  }catch(error){log=[];until=0}
  return {log:Array.isArray(log)?log:[],until:until||0};
}
function showReloadPaused(why){
  if(document.getElementById('reload-paused'))return;
  const main=document.querySelector('main.content');
  if(!main)return;
  const box=document.createElement('div');
  box.className='card';box.id='reload-paused';box.setAttribute('role','status');
  const text=document.createElement('p');
  text.style.color='var(--dg)';
  text.textContent='Sidan laddade om sig själv många gånger på kort tid'+(reloadReasons[why]?` (utlöst av ${reloadReasons[why]})`:'')

  const button=document.createElement('button');
  button.type='button';button.className='small-button';button.textContent='Ladda om nu';
  button.addEventListener('click',()=>{
    try{sessionStorage.removeItem(reloadLogKey);sessionStorage.removeItem(reloadPauseKey)}catch(error){}

  });

  main.prepend(box);

function autoReload(why,before){
  const now=Date.now(),state=reloadState();
  if(now<navigationUntil)return false;
  if(state.until>now){showReloadPaused(why);return false}
  const last=state.log.reduce((latest,entry)=>entry&&entry.why===why?Math.max(latest,entry.t):latest,0);
  if(now-last<(reloadMinGapMs[why]||5000))return false;
  const recent=state.log.filter(entry=>entry&&now-entry.t<reloadWindowMs);
  if(recent.length>=reloadLimit){
    try{sessionStorage.setItem(reloadPauseKey,String(now+reloadPauseMs))}catch(error){}
    console.warn('SubSynq: automatisk omladdning pausad efter '+recent.length+' omladdningar på '+reloadWindowMs/1000+' s (senast: '+why+')');
    showReloadPaused(why);
    return false;
  }
  recent.push({t:now,why});
  try{sessionStorage.setItem(reloadLogKey,JSON.stringify(recent))}catch(error){}
  if(before)before();
  location.reload();
  return true;
}
{
  const state=reloadState();

// </reload-guard>
function rememberOpenSeasons(){
  const open=[...document.querySelectorAll('.season-group[open]')].map(folder=>folder.dataset.season);
  const openSeries=[...document.querySelectorAll('.series-group[open]')].map(folder=>folder.dataset.series);
  const openTracks=[...document.querySelectorAll('.track-details[open]')].map(details=>details.dataset.trackPath);
  sessionStorage.setItem(openSeasonsKey,JSON.stringify(open));
  sessionStorage.setItem(openSeriesKey,JSON.stringify(openSeries));
  sessionStorage.setItem(openTracksKey,JSON.stringify(openTracks));

  const saved=new Set(values);
  restoredSeasons=saved;
  document.querySelectorAll('.season-group').forEach(folder=>{
    folder.open=saved.has(folder.dataset.season);
  });
  let seriesValues=[];
  try{seriesValues=JSON.parse(sessionStorage.getItem(openSeriesKey)||'[]')}catch(error){seriesValues=[]}
  const savedSeries=new Set(seriesValues);

  const savedTracks=new Set(trackValues);

let cloudListRequest=0,cloudListAbort=null;

  const box=event.target;
  if(!box.matches||!box.matches('#cloud-search input[name="vram"]'))return;
  const form=box.form,params=new URLSearchParams();
  params.set('provider',form.elements.provider.value);
  const query=form.elements.gpu_query;
  if(query&&query.value.trim())params.set('gpu',query.value.trim());
  form.querySelectorAll('input[name="vram"]:checked').forEach(item=>params.append('vram',item.value));
  const address='/settings/cloud?'+params.toString(),holder=document.getElementById('cloud-results');
  if(!holder||!window.fetch||!window.DOMParser){window.location.href=address;return}
  const ticket=++cloudListRequest;
  if(cloudListAbort)cloudListAbort.abort();
  cloudListAbort=window.AbortController?new AbortController():null;
  holder.setAttribute('aria-busy','true');
  fetch(address,{credentials:'same-origin',signal:cloudListAbort?cloudListAbort.signal:undefined})
    .then(response=>{if(!response.ok)throw new Error('http '+response.status);return response.text()})
    .then(html=>{
      if(ticket!==cloudListRequest)return;
      const fresh=new DOMParser().parseFromString(html,'text/html').getElementById('cloud-results');
      if(!fresh)throw new Error('no list');
      holder.innerHTML=fresh.innerHTML;
      holder.removeAttribute('aria-busy');
      history.replaceState(null,'',address);
    })

    if(!nav||!navigator.sendBeacon)return;
    const ms=value=>String(Math.max(0,Math.round(value||0)));
    const slowest=performance.getEntriesByType('resource').reduce((worst,entry)=>entry.duration>worst.duration?entry:worst,{duration:-1,name:''});
    const connection=navigator.connection||{};
    const data=new URLSearchParams({
      page:location.pathname,type:nav.type,protocol:nav.nextHopProtocol||'',ect:connection.effectiveType||'',
      total:ms(nav.loadEventStart),blocked:ms(nav.requestStart-nav.fetchStart-(nav.connectEnd-nav.domainLookupStart)),
      dns:ms(nav.domainLookupEnd-nav.domainLookupStart),connect:ms(nav.connectEnd-nav.connectStart),
      ttfb:ms(nav.responseStart-nav.requestStart),download:ms(nav.responseEnd-nav.responseStart),
      dom:ms(nav.domContentLoadedEventEnd-nav.responseEnd),load:ms(nav.loadEventStart-nav.domContentLoadedEventEnd),
      unload:ms(nav.unloadEventEnd-nav.unloadEventStart),redirect:ms(nav.redirectEnd-nav.redirectStart),
      rtt:ms(connection.rtt),size:ms(nav.encodedBodySize),
      slowest:slowest.duration>=0?new URL(slowest.name,location.href).pathname:'',slowest_ms:ms(slowest.duration)});
    navigator.sendBeacon('/api/client-timing',data);
  }catch(error){/* A measurement must never disturb the page. */}
},0));
</script>
</html>
